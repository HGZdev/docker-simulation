services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-store}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  prisma-init:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store?schema=public
    depends_on:
      - postgres
    command: ["sh", "-c", "npm install && npm run prisma:generate --workspace @docker-simulation/db && npm run prisma:push --workspace @docker-simulation/db && npm run prisma:seed --workspace @docker-simulation/db"]

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
      ALLOW_PLAINTEXT_LISTENER: yes
    ports:
      - "9092:9092"

  catalog-api:
    build:
      context: .
      dockerfile: apps/catalog-api/Dockerfile
    environment:
      CATALOG_API_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store?schema=public
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - prisma-init
    command: ["npm", "run", "start:catalog"]

  orders-api:
    build:
      context: .
      dockerfile: apps/orders-api/Dockerfile
    environment:
      ORDERS_API_PORT: 3002
      SWAGGER_SERVER_URL: http://localhost:3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store?schema=public
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - prisma-init
    command: ["npm", "run", "start:orders"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/store?schema=public
    depends_on:
      - postgres
      - prisma-init
    command: ["npm", "run", "start:worker"]

volumes:
  postgres-data:
